name: Build Signed Release (AAB + APK)

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JS dependencies
        run: npm ci --omit=dev

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 nao configurado. Veja BUILD_APK.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/frota-release.keystore"

      - name: Build signed AAB and APK
        working-directory: android
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/frota-release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace

      - name: Collect artifacts
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab Frota-release.aab
          cp android/app/build/outputs/apk/release/app-release.apk Frota-release.apk
          ls -la Frota-release.*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Frota-release
          path: |
            Frota-release.aab
            Frota-release.apk
          if-no-files-found: error

      - name: Publish to a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_number }}
          name: Frota Release assinado (build ${{ github.run_number }})
          files: |
            Frota-release.aab
            Frota-release.apk
          body: |
            Build **assinado de release** do app Frota.
            - `Frota-release.aab` → suba na Google Play Console.
            - `Frota-release.apk` → instalação direta assinada com a chave de release.
