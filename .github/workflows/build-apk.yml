name: Build Android APK

on:
  push:
    branches: [ "claude/transform-apk-qzr6w7" ]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JS dependencies
        run: npm ci --omit=dev

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Frota.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Frota-apk
          path: Frota.apk
          if-no-files-found: error

      - name: Publish APK to a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: Frota APK (build ${{ github.run_number }})
          files: Frota.apk
          body: |
            Debug APK do app **Frota** gerado automaticamente a partir do PWA (Capacitor).
            Baixe `Frota.apk` abaixo e instale no Android (permita "fontes desconhecidas").
