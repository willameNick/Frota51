<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<title>Frota — Gestão de Frotas e Oficina</title>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#0b2545"/>
<link rel="icon" href="icons/icon-192.png"/>
<style>
:root{
  --navy:#0b2545; --navy2:#123a6b; --blue:#2f6fdb; --gray:#f3f5f8; --line:#e3e8ef;
  --text:#1f2937; --muted:#6b7280; --white:#fff;
  --ok:#1a9c63; --warn:#e0a721; --bad:#d64545; --info:#2f6fdb;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--gray);color:var(--text);}
#app{max-width:1200px;margin:0 auto;padding-bottom:70px;}
header.top{background:var(--navy);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;}
header.top h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.3px}
header.top .sub{font-size:11px;opacity:.75;margin-top:2px}
.badge-perfil{background:rgba(255,255,255,.14);border-radius:20px;padding:5px 10px;font-size:11px;cursor:pointer;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}
.dot.on{background:#3ddc84}.dot.off{background:#e0a721}
main{padding:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;gap:10px}
.kpi-grid{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.kpi{background:#fff;border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:10px;padding:12px}
.kpi.ok{border-left-color:var(--ok)} .kpi.warn{border-left-color:var(--warn)} .kpi.bad{border-left-color:var(--bad)}
.kpi .n{font-size:24px;font-weight:800;color:var(--navy)}
.kpi .l{font-size:11.5px;color:var(--muted);margin-top:2px}
h2.sec{font-size:14px;color:var(--navy);text-transform:uppercase;letter-spacing:.4px;margin:18px 0 8px}
.banner{background:#fff4d6;border:1px solid #f0d792;color:#7a5b06;padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:12px}
.banner.bad{background:#fde2e2;border-color:#f3b7b7;color:#8a1f1f}
button{cursor:pointer;font-family:inherit}
.btn{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:9px 14px;font-size:13.5px;font-weight:600}
.btn.sec{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:6px}
.btn.ghost{background:transparent;color:var(--navy);border:1px solid var(--line)}
.btn.danger{background:var(--bad)}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;background:#fff}
label{font-size:12px;color:var(--muted);display:block;margin:8px 0 4px;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row > *{flex:1;min-width:120px}
.list-item{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:none}
.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
.pill.disponivel{background:#e3f6ec;color:var(--ok)}
.pill.bloqueado,.pill.sinistro{background:#fde2e2;color:var(--bad)}
.pill.oficina_interna,.pill.oficina_externa,.pill.aguardando_peca,.pill.aguardando_orcamento{background:#fdf1d6;color:#916a05}
.pill.em_rota,.pill.preventiva_programada{background:#e6eefc;color:var(--blue)}
.pill.inativo,.pill.vendido{background:#eee;color:#777}
.tabs-bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:6px 2px;z-index:30;max-width:1200px;margin:0 auto}
.tabs-bottom button{background:none;border:none;font-size:10.5px;color:var(--muted);display:flex;flex-direction:column;
  align-items:center;gap:2px;padding:5px 2px;flex:1}
.tabs-bottom button.active{color:var(--navy);font-weight:700}
.tabs-bottom .ic{font-size:18px}
.modal-bg{position:fixed;inset:0;background:rgba(11,37,69,.55);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;border-radius:16px 16px 0 0;max-width:600px;width:100%;max-height:92vh;overflow:auto;padding:16px}
.modal h3{margin:0 0 10px;color:var(--navy)}
.close-x{float:right;background:none;border:none;font-size:20px;color:var(--muted)}
table.simple{width:100%;border-collapse:collapse;font-size:13px}
table.simple th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;padding:6px 4px;border-bottom:2px solid var(--line)}
table.simple td{padding:8px 4px;border-bottom:1px solid var(--line)}
.chk-grupo{margin-bottom:14px}
.chk-grupo h4{font-size:13px;color:var(--navy2);margin:0 0 6px}
.chk-item{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:6px}
.chk-item .nome{font-size:13.5px;font-weight:600;margin-bottom:6px}
.opts{display:flex;gap:5px;flex-wrap:wrap}
.opt{border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:11.5px;background:#fff;cursor:pointer}
.opt.sel-conforme{background:#1a9c63;color:#fff;border-color:#1a9c63}
.opt.sel-nc_leve{background:#f0d792;color:#5a4300;border-color:#f0d792}
.opt.sel-nc_moderada{background:#e0a721;color:#fff;border-color:#e0a721}
.opt.sel-critica{background:#d64545;color:#fff;border-color:#d64545}
.opt.sel-na{background:#e5e7eb;color:#444;border-color:#e5e7eb}
.kanban{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.kcol{min-width:230px;background:#eef1f6;border-radius:10px;padding:8px;flex-shrink:0}
.kcol h4{font-size:11.5px;color:var(--navy);text-transform:uppercase;margin:2px 4px 8px;display:flex;justify-content:space-between}
.kcard{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;font-size:12.5px;cursor:pointer}
.kcard .p{font-weight:700;color:var(--navy)}
.kcard .atraso{color:var(--bad);font-weight:700}
.sync-toast{position:fixed;top:8px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;
  padding:6px 14px;border-radius:20px;font-size:12px;z-index:200}
.photo-thumb{width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--line);margin:4px 4px 0 0}
.accordion h4{background:#eef1f6;padding:9px 10px;border-radius:8px;margin:8px 0 0;font-size:13px;color:var(--navy2);cursor:pointer}
.accordion .body{padding:8px 4px}
.hidden{display:none !important}
.small{font-size:11.5px;color:var(--muted)}
.timeline-item{border-left:2px solid var(--line);padding:2px 0 10px 12px;position:relative;font-size:12.5px}
.timeline-item::before{content:'';width:8px;height:8px;background:var(--blue);border-radius:50%;position:absolute;left:-5px;top:4px}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div>
      <h1>Frota</h1>
      <div class="sub" id="hdrSub">Gestão Operacional</div>
    </div>
    <div class="badge-perfil" id="perfilBadge" onclick="UI.openPerfil()"><span class="dot off" id="netDot"></span>--</div>
  </header>
  <main id="main"></main>
  <nav class="tabs-bottom" id="tabs"></nav>
</div>
<div id="modalRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
/* =========================================================
   CONFIG
   Os valores vêm de config.js (copie de config.example.js).
   localStorage sobrescreve o arquivo — útil para testar sem
   commitar nada. Ver README.md.
========================================================= */
const FILE_CFG = (typeof window !== 'undefined' && window.FROTA_CONFIG) ? window.FROTA_CONFIG : {};

const DEFAULT_URL = FILE_CFG.supabaseUrl || '';
const DEFAULT_KEY = FILE_CFG.supabaseKey || '';

// Dados de recebimento — cobrança manual via PIX.
// NUNCA commite dados bancários reais em repositório público.
const PIX = Object.assign(
  { chave: '', titular: '', instituicao: '', banco: '', agencia: '', conta: '' },
  FILE_CFG.pix || {},
  (function(){ try { return JSON.parse(localStorage.getItem('dpl_pix') || '{}'); } catch(e){ return {}; } })()
);

const CFG = {
  url: localStorage.getItem('dpl_sb_url') || DEFAULT_URL,
  key: localStorage.getItem('dpl_sb_key') || DEFAULT_KEY,
  frotaOficial: parseInt(localStorage.getItem('dpl_frota_oficial') || FILE_CFG.frotaOficial || '60', 10)
};

let sb = null;
function initSupabase(){
  if(!CFG.url || !CFG.key){
    console.error('[Frota] Supabase não configurado. Preencha web/config.js (veja config.example.js).');
    document.addEventListener('DOMContentLoaded', function(){
      document.body.insertAdjacentHTML('afterbegin',
        '<div style="background:#fde2e2;border:1px solid #f3b7b7;color:#8a1f1f;padding:14px;margin:12px;border-radius:10px;font:13px/1.5 -apple-system,Segoe UI,Roboto,Arial,sans-serif">'
        + '<b>Configuração ausente.</b><br>Copie <code>config.example.js</code> para <code>config.js</code> e preencha a URL e a chave do seu projeto Supabase.'
        + '</div>');
    });
    return;
  }
  sb = supabase.createClient(CFG.url, CFG.key);
}
initSupabase();

/* =========================================================
   DB — wrapper genérico (tabelas com coluna "dados" JSONB)
========================================================= */
const TABLES = ['veiculos','documentos','checklists','condutores','ordens','abastecimentos','pneus','multas','viagens','ocorrencias','planos_preventivos','fornecedores','pecas','orcamentos','cotacoes'];
const STATE = {}; TABLES.forEach(t => STATE[t] = []);

const DB = {
  async loadAll(){
    for (const t of TABLES){
      try{
        const { data, error } = await sb.from(t).select('*').order('created_at', { ascending:false });
        if (error) throw error;
        STATE[t] = data || [];
      }catch(e){ console.warn('load fail', t, e.message); }
    }
  },
  async put(table, id, dados){
    const row = { dados, empresa_id: SESSION.empresaId, updated_at: new Date().toISOString() };
    if (!navigator.onLine){ OFFQ.push(table, id, dados); UI.toast('Sem conexão — salvo localmente, sincroniza depois'); 
      const idx = STATE[table].findIndex(r=>r.id===id);
      const fake = { id: id || UTIL.uuid(), dados, empresa_id: SESSION.empresaId, created_at:new Date().toISOString(), updated_at:new Date().toISOString() };
      if (idx>=0) STATE[table][idx] = fake; else STATE[table].unshift(fake);
      return fake;
    }
    if (id){
      const { data, error } = await sb.from(table).update(row).eq('id', id).select().single();
      if (error){ console.error(error); UI.toast('Erro ao salvar: '+error.message); return null; }
      const idx = STATE[table].findIndex(r=>r.id===id);
      if (idx>=0) STATE[table][idx] = data; else STATE[table].unshift(data);
      return data;
    } else {
      const { data, error } = await sb.from(table).insert(row).select().single();
      if (error){ console.error(error); UI.toast('Erro ao salvar: '+error.message); return null; }
      STATE[table].unshift(data);
      return data;
    }
  },
  async del(table, id){
    const { error } = await sb.from(table).delete().eq('id', id);
    if (error){ UI.toast('Erro ao excluir: '+error.message); return false; }
    STATE[table] = STATE[table].filter(r=>r.id!==id);
    return true;
  },
  get(table, id){ return STATE[table].find(r=>r.id===id); },
  subscribeAll(){
    TABLES.forEach(t=>{
      sb.channel('rt_'+t).on('postgres_changes',{event:'*',schema:'public',table:t}, payload=>{
        if (payload.eventType==='DELETE'){ STATE[t] = STATE[t].filter(r=>r.id!==payload.old.id); }
        else { const idx = STATE[t].findIndex(r=>r.id===payload.new.id);
          if (idx>=0) STATE[t][idx]=payload.new; else STATE[t].unshift(payload.new); }
        if (ROUTER.current==='dashboard'||ROUTER.current==='parados'||ROUTER.current==='frota'||ROUTER.current==='preventiva') ROUTER.render();
      }).subscribe();
    });
  }
};

/* Fila offline simples (para checklist em campo sem sinal) */
const OFFQ = {
  key: 'dpl_offline_queue',
  push(table,id,dados){
    const q = JSON.parse(localStorage.getItem(this.key)||'[]');
    q.push({ table, id, dados, ts: Date.now() });
    localStorage.setItem(this.key, JSON.stringify(q));
  },
  async flush(){
    const q = JSON.parse(localStorage.getItem(this.key)||'[]');
    if (!q.length) return;
    UI.toast('Sincronizando '+q.length+' registro(s) pendente(s)...');
    for (const item of q){ await DB.put(item.table, null, item.dados); }
    localStorage.removeItem(this.key);
    UI.toast('Sincronizado!');
  }
};
window.addEventListener('online', ()=>{ document.getElementById('netDot').className='dot on'; OFFQ.flush(); });
window.addEventListener('offline', ()=>{ document.getElementById('netDot').className='dot off'; });

/* =========================================================
   SESSÃO / AUTH — multi-tenant via Supabase Auth
   Cada usuário pertence a 1 empresa (perfis_usuario.empresa_id).
   O RLS do banco já isola os dados por empresa; o app só
   precisa saber qual é a empresa e o perfil do usuário logado.
========================================================= */
const ALCADA_LIMITE = 1500; // acima disso, aprovação de cotação exige Gestor/Gerência
const PERFIS = [
  { id:'gerencia', nome:'Gerência/Diretoria', pode:['ver_tudo','aprovar','custos','auditoria','aprovar_alcada_alta'] },
  { id:'gestor_frota', nome:'Gestor de Frota', pode:['cadastros','programacao','bloqueios','oficinas','fornecedores','indicadores','validar_moderada','aprovar_alcada_alta'] },
  { id:'encarregado', nome:'Encarregado de Oficina', pode:['triagem','os','pecas','liberacao_tecnica','aprovar_alcada_baixa'] },
  { id:'mecanico', nome:'Mecânico', pode:['executar_tarefas','medicoes','pecas','fotos'] },
  { id:'condutor', nome:'Condutor/Equipe', pode:['checklist','avarias','km','abastecimento'] },
  { id:'compras', nome:'Compras/Financeiro', pode:['cotacoes','pedidos','contratos','pagamentos'] },
  { id:'sesmt', nome:'SESMT/Fiscalização', pode:['seguranca','documentos','inspecoes','bloqueios'] },
  { id:'fornecedor_externo', nome:'Fornecedor externo', pode:['portal_fornecedor'] },
];

const SESSION = { user:null, empresaId:null, empresaNome:null, perfilId:null, nome:null, fornecedorNome:null, pronto:false, plano:null, trialFim:null };

const AUTH = {
  perfil(){
    if (!SESSION.perfilId) return null;
    const base = PERFIS.find(x=>x.id===SESSION.perfilId) || { id:SESSION.perfilId, nome:SESSION.perfilId, pode:[] };
    return { ...base, nome: SESSION.nome || base.nome, fornecedorNome: SESSION.fornecedorNome };
  },
  pode(acao){ const p=this.perfil(); return p && p.pode.includes(acao); },
  isGestorOuGerencia(){ const p=this.perfil(); return p && (p.id==='gestor_frota'||p.id==='gerencia'); },
  podeAprovarValor(valor){ const p=this.perfil(); if(!p) return false;
    return valor <= ALCADA_LIMITE ? (p.pode.includes('aprovar_alcada_baixa')||p.pode.includes('aprovar_alcada_alta')) : p.pode.includes('aprovar_alcada_alta'); },

  async login(email, senha){
    const { data, error } = await sb.auth.signInWithPassword({ email, password:senha });
    if (error) return { error: error.message };
    const ok = await AUTH.carregarPerfil();
    if (!ok) return { error:'Login feito, mas este usuário ainda não foi vinculado a uma empresa. Peça ao administrador para concluir o cadastro (perfis_usuario).' };
    return { data };
  },
  async logout(){ await sb.auth.signOut(); location.reload(); },
  async carregarPerfil(){
    const { data:{ user } } = await sb.auth.getUser();
    if (!user){ SESSION.user=null; SESSION.pronto=true; return false; }
    SESSION.user = user;
    const { data, error } = await sb.from('perfis_usuario').select('*, empresas(nome, frota_oficial, plano, trial_fim)').eq('user_id', user.id).single();
    SESSION.pronto = true;
    if (error || !data){ SESSION.perfilId=null; return false; }
    SESSION.empresaId = data.empresa_id;
    SESSION.perfilId = data.perfil;
    SESSION.nome = data.nome;
    SESSION.fornecedorNome = data.perfil==='fornecedor_externo' ? data.nome : null;
    SESSION.empresaNome = data.empresas ? data.empresas.nome : null;
    SESSION.plano = data.empresas ? data.empresas.plano : null;
    SESSION.trialFim = data.empresas ? data.empresas.trial_fim : null;
    if (data.empresas && data.empresas.frota_oficial) CFG.frotaOficial = data.empresas.frota_oficial;
    return true;
  },
  statusAssinatura(){
    if (SESSION.plano === 'standard') return { liberado:true, diasRestantes:null };
    if (SESSION.plano === 'suspenso') return { liberado:false, motivo:'suspenso' };
    // trial
    const diasRestantes = SESSION.trialFim ? Math.ceil((new Date(SESSION.trialFim)-new Date())/86400000) : 0;
    return { liberado: diasRestantes > 0, diasRestantes, motivo: diasRestantes>0?null:'trial_expirado' };
  },
  linkPagamento(){
    return null; // mantido só por compatibilidade; pagamento agora é via PIX (ver AUTH.dadosPix)
  },
  dadosPix(){
    const mensal = STATE.veiculos ? STATE.veiculos.length * 40 : 0;
    return { ...PIX, valorSugerido: mensal, empresa: SESSION.empresaNome };
  }
};

/* =========================================================
   UTIL
========================================================= */
const UTIL = {
  uuid(){ return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0,v=c=='x'?r:(r&0x3|0x8);return v.toString(16);}); },
  today(){ return new Date().toISOString().slice(0,10); },
  fmtDate(d){ if(!d) return '—'; try{ return new Date(d).toLocaleDateString('pt-BR'); }catch(e){ return d; } },
  fmtDateTime(d){ if(!d) return '—'; try{ return new Date(d).toLocaleString('pt-BR'); }catch(e){ return d; } },
  daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); },
  hash(str){ let h=0; for(let i=0;i<str.length;i++){ h=(h*31+str.charCodeAt(i))|0; } return h.toString(36); },
  usuarioParaEmail(usuario){
    const limpo = usuario.trim().toLowerCase().replace(/[^a-z0-9_.-]/g, '');
    return limpo + '@login.frota.app';
  },
  async fileToDataURL(file){
    return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); });
  },
  async getGeo(){
    return new Promise((res)=>{
      if (!navigator.geolocation) return res(null);
      navigator.geolocation.getCurrentPosition(
        p=>res({lat:p.coords.latitude,lng:p.coords.longitude}),
        ()=>res(null), { timeout:4000 }
      );
    });
  },
  addTimeline(veiculoId, tipo, descricao){
    const v = DB.get('veiculos', veiculoId); if(!v) return;
    const tl = v.dados.timeline || [];
    tl.unshift({ data:new Date().toISOString(), tipo, descricao, usuario:(AUTH.perfil()||{}).nome||'—' });
    v.dados.timeline = tl;
    DB.put('veiculos', veiculoId, v.dados);
  },
  situacaoLabel(s){
    return ({disponivel:'Disponível',em_rota:'Em rota',preventiva_programada:'Preventiva programada',
      oficina_interna:'Oficina interna',oficina_externa:'Oficina externa',aguardando_peca:'Aguardando peça',
      aguardando_orcamento:'Aguardando orçamento',bloqueado:'Bloqueado',sinistro:'Sinistro',
      inativo:'Inativo',vendido:'Vendido'})[s] || s || '—';
  },
  etapaLabel(e){
    return ({aguardando_diagnostico:'Aguardando diagnóstico',orcamento:'Orçamento',aprovacao:'Aprovação',
      peca:'Aguardando peça',execucao:'Execução',teste:'Teste',liberacao:'Liberação'})[e] || e;
  }
};

/* =========================================================
   CHECKLIST — grupos e itens mínimos (roteiro seção 4)
========================================================= */
const CHECKLIST_GRUPOS = [
  { grupo:'Identificação', itens:['Placa/Prefixo confere','Equipe correta','Condutor identificado','Odômetro/Horímetro registrado','Nível de combustível'] },
  { grupo:'Segurança', itens:['Cintos de segurança','Extintor (quando aplicável)','Triângulo','Iluminação','Buzina','Freios','Retrovisores','Pneus (estado geral)'] },
  { grupo:'Mecânica', itens:['Nível de óleo','Água/arrefecimento','Bateria','Vazamentos','Ruídos anormais','Painel/instrumentos','Suspensão','Direção'] },
  { grupo:'Estrutura', itens:['Lataria','Vidros','Carroceria','Proteção lateral','Placa','Limpeza geral'] },
  { grupo:'Especializados', itens:['Munck/Guindauto','Cesto aéreo','Lança','Patolas/Comandos','Parada de emergência','Isolação/certificados','Acessórios'] },
  { grupo:'Documentos', itens:['CRLV','Certificados do implemento','Cronotacógrafo'] },
];
const RESP_ORDER = ['conforme','nc_leve','nc_moderada','critica','na'];
const RESP_LABEL = { conforme:'Conforme', nc_leve:'NC leve', nc_moderada:'NC moderada', critica:'Crítica', na:'N/A' };
const RESP_RANK = { conforme:0, na:0, nc_leve:1, nc_moderada:2, critica:3 };

/* =========================================================
   ROUTER / UI
========================================================= */
const ROUTER = { current:'dashboard',
  render(){
    const p = AUTH.perfil();
    if (p && p.id==='fornecedor_externo' && this.current!=='config'){
      document.getElementById('main').innerHTML = UI.renderPortalFornecedor();
      UI.renderTabs(); return;
    }
    const fn = { dashboard:UI.renderDashboard, frota:UI.renderFrota, checklist:UI.renderChecklistHome,
      preventiva:UI.renderPreventiva, parados:UI.renderParados, config:UI.renderConfig,
      mais:UI.renderMais, fornecedores:UI.renderFornecedores, estoque:UI.renderEstoque,
      pneus:UI.renderPneus, combustivel:UI.renderCombustivel, documentos:UI.renderDocumentos,
      custos:UI.renderCustos, cotacoes:UI.renderCotacoes }[this.current];
    document.getElementById('main').innerHTML = fn ? fn() : '';
    UI.renderTabs();
  }
};

  async doLogin(){
    const usuario = document.getElementById('lg_email').value.trim();
    const senha = document.getElementById('lg_senha').value;
    const erroEl = document.getElementById('lg_erro');
    if (!usuario){ erroEl.textContent = 'Informe o usuário da empresa.'; return; }
    erroEl.textContent = 'Entrando...';
    const res = await AUTH.login(UTIL.usuarioParaEmail(usuario), senha);
    if (res.error){ erroEl.textContent = 'Usuário ou senha incorretos.'; return; }
    await BOOT.iniciarAposLogin();
  },
  async doSignup(){
    const empresa = document.getElementById('su_empresa').value.trim();
    const nome = document.getElementById('su_nome').value.trim();
    const frota = parseInt(document.getElementById('su_frota').value)||0;
    const usuario = document.getElementById('su_email').value.trim();
    const senha = document.getElementById('su_senha').value;
    const erroEl = document.getElementById('su_erro');
    if (!empresa || !nome || !usuario || senha.length < 6){ erroEl.textContent='Preencha nome da empresa, seu nome, usuário e uma senha de pelo menos 6 caracteres.'; return; }
    erroEl.textContent = 'Criando conta...';
    const { data, error } = await sb.auth.signUp({ email: UTIL.usuarioParaEmail(usuario), password:senha });
    if (error){ erroEl.textContent = error.message.includes('registered') ? 'Esse usuário já existe — escolha outro nome.' : error.message; return; }
    UI._pendingSignup = { empresa, nome, frota };
    if (data.session){
      await UI.finalizarCriacaoEmpresa();
    } else {
      erroEl.style.color = 'var(--ok)';
      erroEl.textContent = 'Conta criada! Volte e faça login com o usuário e senha que você escolheu.';
    }
  },
  async finalizarCriacaoEmpresa(){
    const pend = UI._pendingSignup;
    const { error } = await sb.rpc('onboarding_criar_empresa', {
      p_nome_empresa: pend ? pend.empresa : (document.getElementById('cc_empresa')||{}).value,
      p_nome_usuario: pend ? pend.nome : (document.getElementById('cc_nome')||{}).value,
      p_frota_oficial: pend ? pend.frota : parseInt((document.getElementById('cc_frota')||{}).value)||0
    });
    if (error){ UI.toast('Erro ao criar empresa: '+error.message); return; }
    UI.toast('Empresa criada! Bem-vindo(a) ao Frota.');
    await BOOT.iniciarAposLogin();
  },

  /* -------------------- DASHBOARD -------------------- */
  renderDashboard(){
    const veiculos = STATE.veiculos;
    const cadastrados = veiculos.length;
    const oficial = CFG.frotaOficial;
    const disponiveis = veiculos.filter(v=>['disponivel','em_rota'].includes(v.dados.situacao)).length;
    const parados = veiculos.filter(v=>['oficina_interna','oficina_externa','aguardando_peca','aguardando_orcamento','bloqueado'].includes(v.dados.situacao)).length;
    const ofInterna = veiculos.filter(v=>v.dados.situacao==='oficina_interna').length;
    const ofExterna = veiculos.filter(v=>v.dados.situacao==='oficina_externa').length;
    const osAbertas = STATE.ordens.filter(o=>!o.dados.saida || !o.dados.saida.data);
    const corretivas = osAbertas.filter(o=>o.dados.tipo==='corretiva').length;
    const preventivasOS = osAbertas.filter(o=>o.dados.tipo==='preventiva').length;
    const hoje = UTIL.today();
    const saidasHoje = osAbertas.filter(o=>o.dados.previsao_saida && o.dados.previsao_saida.data===hoje).length;
    const em7 = osAbertas.filter(o=>{ const d=o.dados.previsao_saida&&o.dados.previsao_saida.data; if(!d) return false;
      const diff = UTIL.daysBetween(hoje,d); return diff>=0 && diff<=7; }).length;
    const semPrevisao = osAbertas.filter(o=>!o.dados.previsao_saida || !o.dados.previsao_saida.data).length;
    const atrasadas = osAbertas.filter(o=>o.dados.previsao_saida && o.dados.previsao_saida.data && o.dados.previsao_saida.data < hoje);
    const atrasoMedio = atrasadas.length ? Math.round(atrasadas.reduce((s,o)=>s+UTIL.daysBetween(o.dados.previsao_saida.data,hoje),0)/atrasadas.length) : 0;
    const disponibilidadePct = oficial ? Math.round((disponiveis/oficial)*100) : 0;

    let banner = '';
    const status = AUTH.statusAssinatura();
    if (status.liberado && SESSION.plano==='trial' && status.diasRestantes<=3){
      banner += `<div class="banner">🕐 Faltam <b>${status.diasRestantes} dia(s)</b> do seu teste grátis. Veja os dados de pagamento em <b>Config → Assinatura</b> para não perder o acesso.</div>`;
    }
    if (cadastrados !== oficial){
      banner += `<div class="banner">⚠️ Frota oficial = <b>${oficial}</b> veículos/equipamentos, mas há <b>${cadastrados}</b> cadastrados.
        Conciliar cadastro antes de fechar indicadores (governança do roteiro).</div>`;
    }
    const pendValidacao = STATE.checklists.filter(c=>c.dados.resultado==='pendente_validacao').length;
    if (pendValidacao && AUTH.isGestorOuGerencia()){
      banner += `<div class="banner">🟡 ${pendValidacao} checklist(s) com não conformidade moderada aguardando sua validação.</div>`;
    }
    const docsVencidos = STATE.documentos.filter(d=>d.dados.validade && d.dados.validade < hoje).length;
    if (docsVencidos) banner += `<div class="banner bad">📄 ${docsVencidos} documento(s) vencido(s) — acesse "Mais → Documentos".</div>`;
    const estoqueBaixo = STATE.pecas.filter(p=>(p.dados.saldo||0) <= (p.dados.minimo||0)).length;
    if (estoqueBaixo) banner += `<div class="banner">📦 ${estoqueBaixo} peça(s) em ruptura de estoque.</div>`;

    return `
      ${banner}
      <h2 class="sec">Disponibilidade</h2>
      <div class="grid kpi-grid">
        <div class="kpi ${disponibilidadePct>=85?'ok':disponibilidadePct>=60?'warn':'bad'}"><div class="n">${disponibilidadePct}%</div><div class="l">Disponibilidade (base ${oficial})</div></div>
        <div class="kpi ok"><div class="n">${disponiveis}</div><div class="l">Disponíveis</div></div>
        <div class="kpi bad"><div class="n">${parados}</div><div class="l">Parados totais</div></div>
        <div class="kpi"><div class="n">${cadastrados}/${oficial}</div><div class="l">Cadastrados / oficial</div></div>
      </div>
      <h2 class="sec">Oficina</h2>
      <div class="grid kpi-grid">
        <div class="kpi bad"><div class="n">${corretivas}</div><div class="l">Corretivas abertas</div></div>
        <div class="kpi warn"><div class="n">${preventivasOS}</div><div class="l">Preventivas em execução</div></div>
        <div class="kpi"><div class="n">${ofInterna}</div><div class="l">Oficina interna</div></div>
        <div class="kpi"><div class="n">${ofExterna}</div><div class="l">Oficina externa</div></div>
        <div class="kpi ok"><div class="n">${saidasHoje}</div><div class="l">Saídas previstas hoje</div></div>
        <div class="kpi"><div class="n">${em7}</div><div class="l">Saídas previstas (7 dias)</div></div>
        <div class="kpi warn"><div class="n">${semPrevisao}</div><div class="l">Sem previsão de saída</div></div>
        <div class="kpi bad"><div class="n">${atrasoMedio}d</div><div class="l">Atraso médio</div></div>
      </div>
      <h2 class="sec">Atalhos</h2>
      <div class="row">
        <button class="btn" onclick="ROUTER.current='checklist';ROUTER.render()">Novo checklist</button>
        <button class="btn sec" onclick="ROUTER.current='parados';ROUTER.render()">Ver veículos parados</button>
      </div>
      ${(()=>{
        const riscos = veiculos.map(v=>({v, score:UI.calcRisco(v.id)})).filter(r=>r.score>0).sort((a,b)=>b.score-a.score).slice(0,5);
        if (!riscos.length) return '';
        return `<h2 class="sec">Maior risco de falha (heurístico)</h2>
        <div class="card">${riscos.map(r=>`<div class="list-item"><span>${r.v.dados.prefixo}</span>
        <span class="pill ${r.score>=60?'bloqueado':'aguardando_peca'}">${r.score} pts</span></div>`).join('')}
        <div class="small" style="margin-top:6px">Baseado em retrabalho, checklists críticos recentes e preventivas vencidas — não usa telemetria real (ver observação em Config).</div></div>`;
      })()}
    `;
  },

      pbt:g('f_pbt'), implementos:g('f_implementos'), situacao:g('f_situacao'),

    const saved = await DB.put('veiculos', id||null, dados);

      </div>
    `);
  },
  setResp(key, val){ UI._chk.respostas[key]=val; UI.openChecklistForm(); },
  async attachFoto(key, input){
    const file = input.files[0]; if(!file) return;
    const dataUrl = await UTIL.fileToDataURL(file);
    UI._chk.fotos[key] = dataUrl;
    UI.toast('Foto anexada');
  },
  async submitChecklist(){
    const chk = UI._chk;
    const itensAnswered = Object.keys(chk.respostas).length;
    const totalItens = CHECKLIST_GRUPOS.reduce((s,g)=>s+g.itens.length,0);
    if (itensAnswered < totalItens){ UI.toast('Responda todos os itens antes de finalizar'); return; }
    // antifraude: velocidade
    const elapsedSec = (Date.now()-chk.startTs)/1000;
    const alertas = [];
    if (elapsedSec < 30) alertas.push('checklist_muito_rapido');
    // antifraude: reuso de foto (hash simples)
    const usedHashes = JSON.parse(localStorage.getItem('dpl_photo_hashes')||'[]');
    let novoHashes = [...usedHashes];
    Object.values(chk.fotos).forEach(dataUrl=>{
      const h = UTIL.hash(dataUrl.slice(0,500)+dataUrl.length);
      if (usedHashes.includes(h)) alertas.push('possivel_reuso_foto');
      novoHashes.push(h);
    });
    localStorage.setItem('dpl_photo_hashes', JSON.stringify(novoHashes.slice(-500)));
    const geo = await UTIL.getGeo();
    if (!geo) alertas.push('sem_geolocalizacao');

    // pior classificação
    let worst = 'conforme';
    const itens = Object.entries(chk.respostas).map(([key,resp])=>{
      if (RESP_RANK[resp] > RESP_RANK[worst]) worst = resp;
      const [grupo,item] = key.split('|');
      return { grupo, item, resposta:resp, foto: chk.fotos[key]||null };
    });

    const dados = {
      veiculo_id: chk.veiculoId, condutor:(AUTH.perfil()||{}).nome||'—',
      data_hora: new Date().toISOString(), geolocalizacao: geo,
      odometro: parseFloat(document.getElementById('chk_odometro').value)||null,
      itens, fotos_evidencia: { frontal:chk.fotos._frontal, traseira:chk.fotos._traseira, painel:chk.fotos._painel },
      resultado: worst==='critica' ? 'bloqueado' : worst==='nc_moderada' ? 'pendente_validacao' : 'liberado',
      alertas
    };
    const saved = await DB.put('checklists', null, dados);
    const v = DB.get('veiculos', chk.veiculoId);

    if (worst === 'critica'){
      v.dados.situacao = 'bloqueado';
      await DB.put('veiculos', v.id, v.dados);
      UTIL.addTimeline(v.id, 'bloqueio_critico', 'Checklist com item crítico — veículo bloqueado automaticamente');
      // cria OS automática
      const numero = 'OS-'+Date.now().toString().slice(-6);
      await DB.put('ordens', null, {
        numero, veiculo_id: v.id, tipo:'corretiva', prioridade:'alta', solicitante:(AUTH.perfil()||{}).nome||'Checklist',
        status:'aberta', tipo_oficina:'interna', etapa:'aguardando_diagnostico', data_entrada:new Date().toISOString(),
        motivo_entrada:'Item crítico no checklist diário', tarefas:[], pecas:[], mao_obra:[], historico_previsao:[],
        fotos_execucao:{antes:[],durante:[],depois:[]}
      });
      UI.toast('🚫 Veículo BLOQUEADO — OS aberta e equipe notificada (SESMT/Frota).');
    } else if (worst === 'nc_moderada'){
      await DB.put('ocorrencias', null, { veiculo_id:v.id, origem:'checklist', criticidade:'moderada',
        descricao:'Não conformidade moderada em checklist', status:'aberta' });
      UI.toast('🟡 NC moderada registrada — aguarda validação do gestor antes da saída.');
    } else if (worst === 'nc_leve'){
      const prazo = new Date(); prazo.setDate(prazo.getDate()+3);
      await DB.put('ocorrencias', null, { veiculo_id:v.id, origem:'checklist', criticidade:'leve',
        descricao:'Não conformidade leve em checklist', prazo:prazo.toISOString().slice(0,10), status:'aberta' });
      UI.toast('✅ Checklist liberado — ocorrência leve registrada com prazo.');
    } else {
      UI.toast('✅ Checklist conforme — veículo liberado.');
    }
    if (alertas.length) UI.toast('⚠️ Alerta antifraude: '+alertas.join(', '));
    UI.closeModal(); ROUTER.render();
  },

  /* -------------------- PREVENTIVA -------------------- */
  renderPreventiva(){
    const planos = STATE.planos_preventivos;
    return `
      <div class="row" style="margin-bottom:10px"><button class="btn" onclick="UI.openPlanoForm()">+ Novo plano preventivo</button></div>
      <div class="card">
        ${planos.length===0?'<div class="small">Nenhum plano cadastrado.</div>':planos.map(p=>{
          const v = DB.get('veiculos', p.dados.veiculo_id);
          const status = UI.statusPlano(p, v);
          return `<div class="list-item">
            <div><div style="font-weight:700">${v?v.dados.prefixo:'?'} — ${p.dados.servico}</div>
            <div class="small">Gatilho: ${p.dados.gatilho_valor} ${p.dados.gatilho_tipo}</div></div>
            <div>
              <span class="pill ${status==='vencido'?'bloqueado':status==='proximo'?'aguardando_peca':'disponivel'}">${status}</span>
              <button class="btn sm ghost" onclick="UI.executarPlano('${p.id}')">Executar</button>
            </div></div>`;
        }).join('')}
      </div>
    `;
  },
  statusPlano(p, v){
    if (!v) return 'em_dia';
    if (p.dados.gatilho_tipo==='km' && v.dados.odometro){
      const restante = (p.dados.proximo_km||p.dados.gatilho_valor) - v.dados.odometro;
      if (restante <= 0) return 'vencido'; if (restante <= 500) return 'proximo'; return 'em_dia';
    }
    if (p.dados.gatilho_tipo==='tempo' && p.dados.proxima_data){
      const diff = UTIL.daysBetween(UTIL.today(), p.dados.proxima_data);
      if (diff <= 0) return 'vencido'; if (diff <= 7) return 'proximo'; return 'em_dia';
    }
    return 'em_dia';
  },
  openPlanoForm(){
    const veiculos = STATE.veiculos;
    UI.openModal(`
      <button class="close-x" onclick="UI.closeModal()">✕</button>
      <h3>Novo plano preventivo</h3>
      <label>Veículo</label><select id="pp_v">${veiculos.map(v=>`<option value="${v.id}">${v.dados.prefixo} · ${v.dados.placa}</option>`).join('')}</select>

    `);
  },
  async savePlano(){
    const veiculoId = document.getElementById('pp_v').value;
    const tipo = document.getElementById('pp_tipo').value;
    const valor = parseFloat(document.getElementById('pp_valor').value);
    const v = DB.get('veiculos', veiculoId);
    const dados = { veiculo_id: veiculoId, servico: document.getElementById('pp_servico').value,
      gatilho_tipo: tipo, gatilho_valor: valor,
      proximo_km: tipo==='km' ? (v.dados.odometro||0)+valor : null,
      proxima_data: tipo==='tempo' ? new Date(Date.now()+valor*86400000).toISOString().slice(0,10) : null };
    await DB.put('planos_preventivos', null, dados);
    UI.closeModal(); ROUTER.render();
  },
  async executarPlano(id){
    const p = DB.get('planos_preventivos', id);
    const v = DB.get('veiculos', p.dados.veiculo_id);
    if (p.dados.gatilho_tipo==='km'){ p.dados.proximo_km = (v.dados.odometro||0) + p.dados.gatilho_valor; }
    else { p.dados.proxima_data = new Date(Date.now()+p.dados.gatilho_valor*86400000).toISOString().slice(0,10); }
    p.dados.ultima_execucao_data = UTIL.today();
    await DB.put('planos_preventivos', id, p.dados);
    UTIL.addTimeline(v.id, 'preventiva', 'Execução registrada: '+p.dados.servico);
    UI.toast('Execução registrada, próximo vencimento recalculado.');
    ROUTER.render();
  },

    const motivo = document.getElementById('os_prev_motivo').value;

      UI.toast('Informe o motivo da alteração da previsão de saída'); return;

      d.historico_previsao = d.historico_previsao || [];

  scoreFornecedor(f){
    const osRel = STATE.ordens.filter(o=>o.dados.oficina_nome===f.dados.razao_social && o.dados.tipo_oficina==='externa' && o.dados.saida);
    if (!osRel.length) return 50;
    let pontos = 50;
    osRel.forEach(o=>{
      const prevista = o.dados.previsao_saida && o.dados.previsao_saida.data;
      const real = o.dados.saida.data.slice(0,10);
      if (prevista){ pontos += (real <= prevista) ? 8 : -8; }
      if (o.dados.retrabalho) pontos -= 10;
    });
    return Math.max(0, Math.min(100, Math.round(pontos/osRel.length*osRel.length/Math.max(1,osRel.length)) + Math.round(pontos-50)));
  },

  async saveAbastecimento(){
    const veiculoId = document.getElementById('ab_v').value;
    const odometro = parseFloat(document.getElementById('ab_odo').value)||0;
    const litros = parseFloat(document.getElementById('ab_litros').value)||0;
    const preco = parseFloat(document.getElementById('ab_preco').value)||0;
    const anteriores = STATE.abastecimentos.filter(a=>a.dados.veiculo_id===veiculoId).sort((a,b)=>(b.dados.odometro||0)-(a.dados.odometro||0));
    const anterior = anteriores[0];
    const anomalias = [];
    let kml = null;
    if (anterior){
      if (odometro <= anterior.dados.odometro){ anomalias.push('odometro_inconsistente'); }
      else { kml = (odometro - anterior.dados.odometro) / (litros||1);
        if (anterior.dados.km_l && kml < anterior.dados.km_l*0.7) anomalias.push('queda_abrupta_media'); }
      const minutos = (new Date() - new Date(anterior.dados.data_hora))/60000;
      if (minutos < 30 && Math.abs(odometro-anterior.dados.odometro) < 5) anomalias.push('abastecimento_duplicado');
    }
    const mediaPrecos = STATE.abastecimentos.length ? STATE.abastecimentos.reduce((s,a)=>s+(a.dados.preco_litro||0),0)/STATE.abastecimentos.length : preco;
    if (mediaPrecos && Math.abs(preco-mediaPrecos)/mediaPrecos > 0.3) anomalias.push('preco_fora_da_faixa');
    const dados = { veiculo_id:veiculoId, condutor:(AUTH.perfil()||{}).nome, data_hora:new Date().toISOString(),
      odometro, litros, preco_litro:preco, valor: +(litros*preco).toFixed(2), posto:document.getElementById('ab_posto').value,
      km_l: kml, anomalias };
    await DB.put('abastecimentos', null, dados);
    const v = DB.get('veiculos', veiculoId); if (v){ v.dados.odometro = Math.max(v.dados.odometro||0, odometro); DB.put('veiculos', veiculoId, v.dados); }
    if (anomalias.length) UI.toast('⚠️ Anomalia detectada: '+anomalias.join(', '));
    UI.closeModal(); ROUTER.render();
  },

  /* -------------------- CUSTOS / ORÇAMENTO / TCO -------------------- */
  renderCustos(){
    const custoOS = STATE.ordens.reduce((s,o)=>s+((o.dados.custos&&o.dados.custos.total)||0),0);
    const custoComb = STATE.abastecimentos.reduce((s,a)=>s+(a.dados.valor||0),0);
    const custoPneus = STATE.pneus.reduce((s,p)=>s+(p.dados.custo||0),0);
    const custoMultas = STATE.multas.reduce((s,m)=>s+(m.dados.valor||0),0);
    const total = custoOS+custoComb+custoPneus+custoMultas;
    const kmTotal = STATE.veiculos.reduce((s,v)=>s+(v.dados.odometro||0),0) || 1;
    const custoKm = total/kmTotal;
    // por centro de custo
    const porCC = {};
    function add(cc, valor){ porCC[cc||'Não informado'] = (porCC[cc||'Não informado']||0)+valor; }
    STATE.ordens.forEach(o=>{ const v=DB.get('veiculos', o.dados.veiculo_id); add(v&&v.dados.centro_custo, (o.dados.custos&&o.dados.custos.total)||0); });
    STATE.abastecimentos.forEach(a=>{ const v=DB.get('veiculos', a.dados.veiculo_id); add(v&&v.dados.centro_custo, a.dados.valor||0); });
    return `
      <h2 class="sec">Visão geral</h2>
      <div class="grid kpi-grid">
        <div class="kpi"><div class="n">R$ ${total.toFixed(0)}</div><div class="l">Custo total (histórico)</div></div>
        <div class="kpi"><div class="n">R$ ${custoKm.toFixed(2)}</div><div class="l">Custo por km</div></div>
        <div class="kpi warn"><div class="n">R$ ${custoOS.toFixed(0)}</div><div class="l">Manutenção (OS)</div></div>
        <div class="kpi"><div class="n">R$ ${custoComb.toFixed(0)}</div><div class="l">Combustível</div></div>
        <div class="kpi"><div class="n">R$ ${custoPneus.toFixed(0)}</div><div class="l">Pneus</div></div>
        <div class="kpi bad"><div class="n">R$ ${custoMultas.toFixed(0)}</div><div class="l">Multas</div></div>
      </div>
      <h2 class="sec">Custo por centro de custo</h2>
      <div class="card">
        ${Object.entries(porCC).length===0?'<div class="small">Sem dados suficientes ainda.</div>':Object.entries(porCC).map(([cc,v])=>
          `<div class="list-item"><span>${cc}</span><span>R$ ${v.toFixed(2)}</span></div>`).join('')}
      </div>
      <h2 class="sec">TCO — manter, substituir ou locar</h2>
      <div class="card">
        ${STATE.veiculos.filter(v=>v.dados.valor_aquisicao).length===0 ? '<div class="small">Cadastre o valor de aquisição na ficha do veículo para habilitar esta análise.</div>' :
          STATE.veiculos.filter(v=>v.dados.valor_aquisicao).map(v=>{
            const custoOSv = STATE.ordens.filter(o=>o.dados.veiculo_id===v.id).reduce((s,o)=>s+((o.dados.custos&&o.dados.custos.total)||0),0);
            const custoCombv = STATE.abastecimentos.filter(a=>a.dados.veiculo_id===v.id).reduce((s,a)=>s+(a.dados.valor||0),0);
            const custoPneusv = STATE.pneus.filter(p=>p.dados.veiculo_id===v.id).reduce((s,p)=>s+(p.dados.custo||0),0);
            const acumulado = custoOSv+custoCombv+custoPneusv;
            const pct = acumulado / v.dados.valor_aquisicao;
            const idade = v.dados.data_aquisicao ? (UTIL.daysBetween(v.dados.data_aquisicao, UTIL.today())/365) : null;
            let rec = 'Manter', cls='disponivel';
            if (pct > 0.6 || (idade && idade > 8)){ rec='Avaliar substituição'; cls='bloqueado'; }
            else if (pct > 0.3){ rec='Monitorar'; cls='aguardando_peca'; }
            return `<div class="list-item"><div><div style="font-weight:700">${v.dados.prefixo}</div>
            <div class="small">Custo acumulado R$ ${acumulado.toFixed(0)} (${(pct*100).toFixed(0)}% do valor de aquisição)${idade?' · '+idade.toFixed(1)+' anos':''}</div></div>
            <span class="pill ${cls}">${rec}</span></div>`;
          }).join('')}
      </div>
      <div class="small" style="margin-top:6px">Heurística simples (custo acumulado vs. valor de aquisição + idade). Um TCO financeiro completo (depreciação real, valor residual de mercado, custo de capital) é um refinamento de P3.</div>
    `;
  },

  /* -------------------- COTAÇÕES (com aprovação por alçada) -------------------- */
  renderCotacoes(){
    const list = STATE.cotacoes;
    return `
      <div class="row" style="margin-bottom:10px"><button class="btn" onclick="UI.openCotacaoForm()">+ Nova cotação</button></div>
      <div class="small" style="margin-bottom:10px">Alçada: até R$ ${ALCADA_LIMITE} aprova Encarregado/Gestor; acima disso, só Gestor/Gerência.</div>
      <div class="card">
        ${list.length===0?'<div class="small">Nenhuma cotação registrada.</div>':list.map(c=>{
          const d=c.dados; const podeAprovar = d.status==='pendente' && AUTH.podeAprovarValor(d.valor);
          return `<div class="list-item">
            <div><div style="font-weight:700">${d.descricao} — R$ ${d.valor.toFixed(2)}</div>
            <div class="small">${d.fornecedor||'—'} · prazo ${d.prazo_dias||'?'}d · ${d.valor>ALCADA_LIMITE?'alçada alta':'alçada baixa'}</div></div>
            <div>
              <span class="pill ${d.status==='aprovada'?'disponivel':d.status==='reprovada'?'bloqueado':'aguardando_orcamento'}">${d.status}</span>
              ${podeAprovar?`<button class="btn sm" onclick="UI.aprovarCotacao('${c.id}',true)">Aprovar</button><button class="btn sm ghost" onclick="UI.aprovarCotacao('${c.id}',false)">Reprovar</button>`
                : d.status==='pendente' ? '<div class="small">sem alçada p/ aprovar</div>' : ''}
            </div></div>`;
        }).join('')}
      </div>
    `;
  },
  openCotacaoForm(){
    const fornecedores = STATE.fornecedores;
    UI.openModal(`
      <button class="close-x" onclick="UI.closeModal()">✕</button>
      <h3>Nova cotação</h3>
      <label>Descrição (peça/serviço)</label><input id="ct_desc">
      <label>Fornecedor</label><select id="ct_forn"><option value="">— avulso —</option>${fornecedores.map(f=>`<option value="${f.dados.razao_social}">${f.dados.razao_social}</option>`).join('')}</select>
      <div class="row"><div><label>Valor (R$)</label><input id="ct_valor" type="number" step="0.01"></div>
      <div><label>Prazo (dias)</label><input id="ct_prazo" type="number"></div></div>
      <div class="row" style="margin-top:12px">
        <button class="btn" onclick="UI.saveCotacao()">Enviar para aprovação</button>
        <button class="btn ghost" onclick="UI.closeModal()">Cancelar</button>
      </div>
    `);
  },
  async saveCotacao(){
    const dados = { descricao: document.getElementById('ct_desc').value, fornecedor: document.getElementById('ct_forn').value,
      valor: parseFloat(document.getElementById('ct_valor').value)||0, prazo_dias: parseInt(document.getElementById('ct_prazo').value)||null,
      status:'pendente' };
    await DB.put('cotacoes', null, dados); UI.closeModal(); ROUTER.render();
  },
  async aprovarCotacao(id, aprovar){
    const c = DB.get('cotacoes', id);
    if (!AUTH.podeAprovarValor(c.dados.valor)){ UI.toast('Sem alçada para este valor'); return; }
    c.dados.status = aprovar ? 'aprovada' : 'reprovada';
    c.dados.aprovado_por = (AUTH.perfil()||{}).nome;
    await DB.put('cotacoes', id, c.dados);
    UI.toast(aprovar?'✅ Cotação aprovada':'Cotação reprovada'); ROUTER.render();
  },

  /* -------------------- RISCO DE FALHA (heurístico, sem telemetria real) -------------------- */
  calcRisco(veiculoId){
    const hoje = UTIL.today();
    const os180 = STATE.ordens.filter(o=>o.dados.veiculo_id===veiculoId && UTIL.daysBetween(o.dados.data_entrada, hoje) <= 180);
    const reaberturas = os180.filter(o=>o.dados.retrabalho).length;
    const criticos90 = STATE.checklists.filter(c=>c.dados.veiculo_id===veiculoId && c.dados.resultado==='bloqueado' && UTIL.daysBetween(c.dados.data_hora, hoje) <= 90).length;
    const preventivaVencida = STATE.planos_preventivos.filter(p=>p.dados.veiculo_id===veiculoId).filter(p=>UI.statusPlano(p, DB.get('veiculos',veiculoId))==='vencido').length;
    return Math.min(100, reaberturas*30 + criticos90*25 + preventivaVencida*20);
  },

  /* -------------------- PORTAL DO FORNECEDOR (somente leitura) -------------------- */
  renderPortalFornecedor(){
    const p = AUTH.perfil();
    const minhasOS = STATE.ordens.filter(o=>o.dados.oficina_nome===p.fornecedorNome);
    const minhasCot = STATE.cotacoes.filter(c=>c.dados.fornecedor===p.fornecedorNome);
    return `
      <div class="banner">Portal restrito do fornecedor <b>${p.fornecedorNome}</b> — somente leitura + envio de orçamento.</div>
      <h2 class="sec">Minhas ordens de serviço</h2>
      <div class="card">${minhasOS.length===0?'<div class="small">Nenhuma OS vinculada a este nome de fornecedor ainda.</div>':minhasOS.map(o=>{
        const v = DB.get('veiculos', o.dados.veiculo_id);
        return `<div class="list-item"><span>${v?v.dados.prefixo:'?'} — ${UTIL.etapaLabel(o.dados.etapa)}</span>
        <span class="small">${o.dados.previsao_saida?UTIL.fmtDate(o.dados.previsao_saida.data):'sem previsão'}</span></div>`;
      }).join('')}</div>
      <h2 class="sec">Minhas cotações</h2>
      <div class="card">${minhasCot.length===0?'<div class="small">Nenhuma cotação enviada.</div>':minhasCot.map(c=>
        `<div class="list-item"><span>${c.dados.descricao} — R$ ${c.dados.valor.toFixed(2)}</span><span class="pill ${c.dados.status==='aprovada'?'disponivel':c.dados.status==='reprovada'?'bloqueado':'aguardando_orcamento'}">${c.dados.status}</span></div>`).join('')}</div>
      <div class="row" style="margin-top:10px"><button class="btn" onclick="UI.openCotacaoForm()">+ Enviar orçamento</button></div>
    `;
  },

  /* -------------------- CONFIG -------------------- */
  renderConfig(){
    const p = AUTH.perfil();
    const status = AUTH.statusAssinatura();
    return `
      <div class="card">
        <h2 class="sec" style="margin-top:0">Conta</h2>
        <div>Empresa: <b>${SESSION.empresaNome||'—'}</b></div>
        <div>Usuário: <b>${SESSION.user?SESSION.user.email.split('@')[0]:'—'}</b></div>
        <div>Perfil: <b>${p?p.nome:'—'}</b></div>
        <button class="btn danger" style="margin-top:8px" onclick="AUTH.logout()">Sair</button>
      </div>
      <div class="card">
        <h2 class="sec" style="margin-top:0">Assinatura</h2>
        <div>Plano: <b>${SESSION.plano==='standard'?'Ativo':SESSION.plano==='suspenso'?'Suspenso':'Teste grátis'}</b></div>
        <div class="small" style="margin-top:4px">R$ 40,00 por veículo/equipamento cadastrado, por mês.</div>
        <div class="small">Frota atual: ${STATE.veiculos.length} veículo(s) → mensalidade estimada: <b>R$ ${(STATE.veiculos.length*40).toFixed(2)}</b>/mês.</div>
        ${SESSION.plano==='trial' ? `<div class="small" style="margin-top:6px">Faltam ${status.diasRestantes>0?status.diasRestantes:0} dia(s) de teste.</div>` : ''}
      </div>
      ${SESSION.plano!=='standard' ? UI.blocoPix() : ''}
      ${AUTH.isGestorOuGerencia() ? UI.renderAdminEquipe() : ''}
      <div class="card">
        <h2 class="sec" style="margin-top:0">Roteiro — escopo desta versão (P0 + P1 + P2-lite + Multi-tenant)</h2>
        <div class="small">✅ P0: Cadastro 360°, checklist com bloqueio crítico, OS/oficina interna e externa, previsão de saída com histórico, painel de veículos parados, agenda preventiva, dashboard executivo.</div>
        <div class="small" style="margin-top:6px">✅ P1: fornecedores com ranking automático, estoque de peças com alerta de ruptura, pneus por posição/sulco, combustível com detecção de anomalias, documentos com alertas 90/60/30/15/7, multas, custos por centro de custo.</div>
        <div class="small" style="margin-top:6px">✅ P2 (parte lógica): cotações com aprovação por alçada, portal do fornecedor externo, TCO heurístico, ranking de risco de falha.</div>
        <div class="small" style="margin-top:6px">✅ Multi-tenant: login por empresa, dados isolados por empresa, pronto para vender o mesmo sistema a múltiplos clientes sem misturar dados.</div>
        <div class="small" style="margin-top:6px">✅ Onboarding self-service: uma empresa nova cria a própria conta e já entra usando o sistema sozinha.</div>
        <div class="small" style="margin-top:6px">✅ Cobrança via PIX: toda empresa nova começa com 7 dias de teste grátis; ao vencer, o acesso é bloqueado com uma tela mostrando os dados de pagamento PIX e a mensalidade estimada.</div>
        <div class="small" style="margin-top:6px">🚫 Ainda não incluído: confirmação automática de pagamento (a liberação após o PIX cair é manual), convite de mais pessoas com perfil diferente dentro da mesma empresa, telemetria/OBD real, ERP, OCR.</div>
      </div>
    `;
  }
};

/* =========================================================
   BOOT
========================================================= */
const BOOT = {
  async iniciarAposLogin(){
    document.getElementById('modalRoot').innerHTML = '';
    const status = AUTH.statusAssinatura();
    if (!status.liberado){
      document.getElementById('main').innerHTML = UI.renderPaywall(status.motivo);
      document.getElementById('tabs').innerHTML = '';
      UI.updateHeader();
      return;
    }
    UI.updateHeader();
    await DB.loadAll();
    DB.subscribeAll();
    OFFQ.flush();
    ROUTER.current = 'dashboard';
    ROUTER.render();
  }
};

(async function boot(){
  if ('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
  document.getElementById('netDot').className = navigator.onLine ? 'dot on' : 'dot off';

  const { data:{ session } } = await sb.auth.getSession();
  if (!session){
    ROUTER._tela = 'login';
    UI.renderAuthScreen();
    return;
  }
  const ok = await AUTH.carregarPerfil();
  if (!ok){
    document.getElementById('main').innerHTML = UI.renderCompletarCadastro();
    document.getElementById('tabs').innerHTML = '';
    return;
  }
  await BOOT.iniciarAposLogin();

  sb.auth.onAuthStateChange((event)=>{
    if (event === 'SIGNED_OUT'){ location.reload(); }
  });
})();
</script>
</body>
</html>
