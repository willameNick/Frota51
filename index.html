<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>GiMusic · música sem anúncios</title>
<style>
  :root{
    --bg:#0a0a0a; --bg2:#141414; --card:#1b1b1b; --card-h:#242424;
    --red:#e50914; --red-soft:#ff2b36; --txt:#f2f2f2; --dim:#9a9a9a; --line:#2a2a2a;
    --player-h:88px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:radial-gradient(1200px 600px at 50% -10%, #1a0406 0%, var(--bg) 55%) fixed;
    color:var(--txt); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding-bottom:calc(var(--player-h) + env(safe-area-inset-bottom));
    overflow-x:hidden;
  }
  a{color:inherit;text-decoration:none}

  header{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg, rgba(10,10,10,.96), rgba(10,10,10,.82) 70%, transparent);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    padding:calc(14px + env(safe-area-inset-top)) 16px 10px;
  }
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--red),#7a0509);
    display:grid;place-items:center;box-shadow:0 4px 18px rgba(229,9,20,.45)}
  .logo svg{width:18px;height:18px;fill:#fff}
  .brand h1{font-size:19px;font-weight:800;letter-spacing:.3px}
  .brand h1 span{color:var(--red-soft)}
  .brand .tag{margin-left:auto;font-size:10px;color:var(--dim);border:1px solid var(--line);
    padding:4px 8px;border-radius:20px}

  .search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:11px 14px;transition:border-color .2s}
  .search:focus-within{border-color:var(--red)}
  .search svg{width:18px;height:18px;fill:var(--dim);flex:none}
  .search input{flex:1;background:none;border:none;outline:none;color:var(--txt);font-size:15px}
  .search input::placeholder{color:var(--dim)}

  nav.tabs{display:flex;gap:8px;padding:12px 16px 4px;overflow-x:auto;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  .tab{white-space:nowrap;padding:8px 16px;border-radius:20px;background:var(--card);
    color:var(--dim);font-size:13px;font-weight:600;border:1px solid transparent;cursor:pointer;transition:.15s}
  .tab.active{background:var(--red);color:#fff;box-shadow:0 4px 14px rgba(229,9,20,.4)}

  main{padding:6px 16px 20px;max-width:860px;margin:0 auto}
  .section-title{font-size:15px;font-weight:700;margin:16px 2px 10px;display:flex;align-items:center;gap:8px}
  .section-title .dot{width:6px;height:6px;border-radius:50%;background:var(--red)}
  .section-title .mini{margin-left:auto;font-size:12px;color:var(--dim);font-weight:600}

  .list{display:flex;flex-direction:column;gap:4px}
  .row{display:flex;align-items:center;gap:11px;padding:8px;border-radius:12px;cursor:pointer;
    transition:background .15s;position:relative}
  .row:hover{background:var(--card)}
  .row.active{background:var(--card-h)}
  .row.active .rtitle{color:var(--red-soft)}
  .art{width:50px;height:50px;border-radius:9px;object-fit:cover;flex:none;background:var(--card-h)}
  .rinfo{flex:1;min-width:0}
  .rtitle{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rartist{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .rdur{font-size:12px;color:var(--dim);flex:none;font-variant-numeric:tabular-nums;margin:0 2px}
  .iconbtn{flex:none;background:none;border:none;cursor:pointer;padding:6px;display:grid;place-items:center}
  .iconbtn svg{width:19px;height:19px;fill:none;stroke:var(--dim);stroke-width:2;transition:.15s}
  .iconbtn.heart.on svg{fill:var(--red);stroke:var(--red)}
  .iconbtn.add svg{stroke:var(--dim)}
  .iconbtn:hover svg{stroke:var(--txt)}
  .iconbtn.more svg{fill:var(--dim);stroke:none}
  .iconbtn.more:hover svg{fill:var(--txt);stroke:none}
  .sheetdiv{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);
    padding:14px 8px 6px;border-top:1px solid var(--line);margin-top:8px}
  .num{width:20px;text-align:center;color:var(--dim);font-size:13px;flex:none;font-variant-numeric:tabular-nums}
  .row.active .num{color:var(--red)}

  /* Grid de playlists */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(min-width:560px){.grid{grid-template-columns:1fr 1fr 1fr}}
  .plcard{border-radius:16px;padding:14px;min-height:118px;position:relative;overflow:hidden;cursor:pointer;
    display:flex;flex-direction:column;justify-content:flex-end;transition:transform .12s;
    box-shadow:0 6px 20px rgba(0,0,0,.35)}
  .plcard:active{transform:scale(.97)}
  .plcard .emoji{font-size:26px;position:absolute;top:12px;left:14px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
  .plcard .pltitle{font-size:15px;font-weight:800;position:relative;z-index:2;text-shadow:0 1px 6px rgba(0,0,0,.5)}
  .plcard .plsub{font-size:11px;opacity:.9;margin-top:2px;position:relative;z-index:2;text-shadow:0 1px 6px rgba(0,0,0,.5)}
  .plcard.new{background:var(--card);border:1.5px dashed var(--line);align-items:center;justify-content:center;
    color:var(--dim);text-align:center}
  .plcard.new .plus{font-size:28px;line-height:1;margin-bottom:6px;color:var(--red)}
  .plcard.mine{background:linear-gradient(135deg,#2a2a2a,#161616)}
  .plcard.mine .cnt{position:absolute;top:12px;right:14px;font-size:11px;color:var(--dim);z-index:2}

  /* Cabeçalho de detalhe da playlist */
  .plhead{display:flex;align-items:center;gap:12px;margin:8px 0 14px}
  .backbtn{background:var(--card);border:1px solid var(--line);border-radius:50%;width:38px;height:38px;
    display:grid;place-items:center;cursor:pointer;flex:none}
  .backbtn svg{width:20px;height:20px;fill:var(--txt)}
  .plhead .htitle{flex:1;min-width:0}
  .plhead .htitle h2{font-size:20px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .plhead .htitle p{font-size:12px;color:var(--dim);margin-top:2px}
  .playall{background:var(--red);border:none;border-radius:24px;color:#fff;font-weight:700;font-size:13px;
    padding:10px 18px;cursor:pointer;display:flex;align-items:center;gap:6px;flex:none}
  .playall svg{width:16px;height:16px;fill:#fff}
  .trash{background:none;border:none;cursor:pointer;padding:8px;flex:none}
  .trash svg{width:20px;height:20px;fill:var(--dim)}

  .empty{text-align:center;color:var(--dim);padding:56px 20px}
  .empty svg{width:52px;height:52px;fill:var(--line);margin-bottom:14px}
  .empty p{font-size:14px;line-height:1.5}
  .skeleton{display:flex;align-items:center;gap:12px;padding:8px}
  .sk{background:linear-gradient(90deg,var(--card) 25%,var(--card-h) 50%,var(--card) 75%);
    background-size:200% 100%;animation:sh 1.2s infinite;border-radius:8px}
  @keyframes sh{to{background-position:-200% 0}}

  /* Player */
  .player{position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:linear-gradient(180deg,var(--bg2),#0d0d0d);border-top:1px solid var(--line);
    padding:0 14px calc(10px + env(safe-area-inset-bottom));
    transform:translateY(120%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
  .player.show{transform:translateY(0)}
  .progress{padding:8px 0 6px}
  .bar{height:5px;background:var(--line);border-radius:3px;position:relative;cursor:pointer}
  .bar-buf{position:absolute;top:0;left:0;height:100%;background:#333;border-radius:3px;width:0%}
  .bar-fill{position:relative;z-index:2;height:100%;background:linear-gradient(90deg,var(--red),var(--red-soft));border-radius:3px;width:0%}
  .knob{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:#fff;
    transform:translate(-50%,-50%);left:0%;z-index:3;box-shadow:0 1px 4px rgba(0,0,0,.5);opacity:0;transition:opacity .15s}
  .bar:hover .knob{opacity:1}
  .times{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);margin-top:3px;font-variant-numeric:tabular-nums}
  .pcontrols{display:flex;align-items:center;gap:12px;padding-bottom:8px}
  .pmeta{display:flex;align-items:center;gap:11px;flex:1;min-width:0}
  .part{width:46px;height:46px;border-radius:8px;object-fit:cover;flex:none;background:var(--card-h)}
  .pinfo{min-width:0;flex:1}
  .ptitle{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .partist{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .btns{display:flex;align-items:center;gap:6px;flex:none}
  .ic{background:none;border:none;cursor:pointer;color:var(--txt);display:grid;place-items:center;
    width:40px;height:40px;border-radius:50%;transition:.15s}
  .ic:hover{background:var(--card-h)}
  .ic svg{width:22px;height:22px;fill:currentColor}
  .ic.play{background:var(--red);width:48px;height:48px}
  .ic.play:hover{background:var(--red-soft);transform:scale(1.05)}
  .ic.play svg{width:24px;height:24px;fill:#fff}
  .ic.small svg{width:18px;height:18px}
  .ic.fav svg{fill:none;stroke:currentColor;stroke-width:2}
  .ic.fav.on{color:var(--red)}
  .ic.fav.on svg{fill:var(--red);stroke:var(--red)}
  .ic:disabled{opacity:.35;cursor:default;background:none;transform:none}

  /* Painel de letra */
  .lyrics{position:fixed;inset:0;z-index:55;background:radial-gradient(900px 500px at 50% -5%,#25060a,#0a0a0a 60%);
    transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
  .lyrics.show{transform:translateY(0)}
  .lyrics-bg{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center;
    filter:blur(30px) brightness(.42) saturate(1.15);transform:scale(1.18);opacity:0;transition:opacity .5s}
  .lyrics-bg.show{opacity:1}
  .lyrics-scrim{position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,rgba(10,10,10,.5),rgba(10,10,10,.8))}
  .lyrics-head,.lyrics-body{position:relative;z-index:2}
  .lyrics-head{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid var(--line)}
  .lyrics-head .close{background:var(--card);border:1px solid var(--line);border-radius:50%;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;flex:none}
  .lyrics-head .close svg{width:22px;height:22px;fill:var(--txt)}
  .lyrics-head .lh{flex:1;min-width:0}
  .lyrics-head h2{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lyrics-head p{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .lyrics-head .tbtn{background:var(--card);border:1px solid var(--line);border-radius:20px;min-width:44px;height:34px;color:var(--dim);font-weight:800;font-size:12px;cursor:pointer;display:none;place-items:center;padding:0 12px;flex:none}
  .lyrics-head .tbtn.on{background:var(--red);border-color:var(--red);color:#fff}
  .lyrics-body{flex:1;overflow:hidden;display:flex;min-height:0}
  .pane{flex:1;overflow-y:auto;padding:8px 20px 45vh;min-width:0}
  .pane+.pane{border-left:1px solid var(--line)}
  .plabel{position:sticky;top:0;background:linear-gradient(180deg,rgba(10,10,10,.92),transparent);
    font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--red-soft);padding:8px 0 10px;z-index:2}
  .line{font-size:18px;line-height:1.5;color:var(--dim);padding:6px 0;opacity:.5;transition:opacity .25s,color .25s}
  .pane.plain .line{opacity:.92}
  .line.active{opacity:1;color:#fff;font-weight:700}
  .pane.trans .line.active{color:var(--red-soft)}
  .lyrics-empty{margin:auto;text-align:center;color:var(--dim);padding:30px}
  .lyrics-empty svg{width:46px;height:46px;fill:var(--line);margin-bottom:14px}
  .lyrics-empty small{color:#6a6a6a}
  .lyrichint{width:16px;height:16px;fill:var(--dim);flex:none;opacity:.7}
  .pmeta{cursor:pointer}
  .spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media(max-width:559px){
    .lyrics-body{flex-direction:column}
    .pane+.pane{border-left:none;border-top:1px solid var(--line)}
    .pane{padding-bottom:22vh}
  }

  /* Bottom sheet (add a playlist) */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
  .overlay.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--bg2);border-top:1px solid var(--line);
    border-radius:20px 20px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(110%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-height:70vh;overflow-y:auto}
  .sheet.show{transform:translateY(0)}
  .sheet .grip{width:38px;height:4px;background:var(--line);border-radius:3px;margin:6px auto 12px}
  .sheet h3{font-size:15px;font-weight:700;margin-bottom:4px;padding:0 4px}
  .sheet .subh{font-size:12px;color:var(--dim);margin-bottom:12px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sheetitem{display:flex;align-items:center;gap:12px;padding:12px 8px;border-radius:12px;cursor:pointer}
  .sheetitem:hover{background:var(--card)}
  .sheetitem .ico{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none;
    background:linear-gradient(135deg,#2a2a2a,#161616);font-size:18px}
  .sheetitem.newpl .ico{background:var(--red);color:#fff}
  .sheetitem .txt{flex:1;min-width:0}
  .sheetitem .txt b{font-size:14px;font-weight:600}
  .sheetitem .txt small{font-size:11px;color:var(--dim);display:block;margin-top:1px}

  .toast{position:fixed;bottom:calc(var(--player-h) + 20px);left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--card-h);color:var(--txt);padding:11px 18px;border-radius:24px;font-size:13px;
    border:1px solid var(--line);opacity:0;pointer-events:none;transition:.25s;z-index:60;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media(min-width:560px){:root{--player-h:82px}}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg></div>
    <h1>Gi<span>Music</span></h1>
    <div class="tag">sua música · sem anúncios</div>
  </div>
  <div class="search">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.49 4.49 0 0 1 9.5 14z"/></svg>
    <input id="q" type="text" placeholder="Buscar músicas, artistas..." autocomplete="off">
  </div>
</header>

<nav class="tabs" id="tabs">
  <div class="tab active" data-view="home">Início</div>
  <div class="tab" data-view="playlists">Playlists</div>
  <div class="tab" data-view="search">Buscar</div>
  <div class="tab" data-view="fav">Favoritos</div>
</nav>

<main id="content"></main>

<div class="player" id="player">
  <div class="progress">
    <div class="bar" id="bar">
      <div class="bar-buf" id="buf"></div>
      <div class="bar-fill" id="fill"></div>
      <div class="knob" id="knob"></div>
    </div>
    <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
  </div>
  <div class="pcontrols">
    <div class="pmeta" id="pmeta">
      <img class="part" id="part" alt="">
      <div class="pinfo">
        <div class="ptitle" id="ptitle">—</div>
        <div class="partist" id="partist"></div>
      </div>
      <svg class="lyrichint" viewBox="0 0 24 24"><path d="M7 15l5-5 5 5z"/></svg>
    </div>
    <div class="btns">
      <button class="ic fav" id="pfav" title="Favoritar">
        <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.9-10-9.6C.4 8.2 1.9 4.5 5.2 4.1 7 3.9 8.7 4.8 12 8c3.3-3.2 5-4.1 6.8-3.9 3.3.4 4.8 4.1 3.2 7.3C19.5 16.1 12 21 12 21z"/></svg>
      </button>
      <button class="ic small" id="prev" title="Anterior">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button class="ic play" id="play" title="Tocar">
        <svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="ic small" id="next" title="Próxima">
        <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zm-9.5 6l8.5 6V6z" transform="scale(-1,1) translate(-24,0)"/></svg>
      </button>
    </div>
  </div>
</div>

<div class="lyrics" id="lyrics">
  <div class="lyrics-bg" id="lyricsBg"></div>
  <div class="lyrics-scrim"></div>
  <div class="lyrics-head">
    <button class="close" id="lyricsClose" title="Fechar"><svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg></button>
    <div class="lh"><h2 id="lyricsTitle">—</h2><p id="lyricsArtist"></p></div>
    <button class="tbtn" id="transToggle" title="Mostrar/ocultar tradução">PT</button>
  </div>
  <div class="lyrics-body" id="lyricsBody"></div>
</div>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<audio id="audio" preload="auto"></audio>

<script>
/* ============ GiMusic — música online legal, sem anúncios (Audius) ============ */
const APP = 'GiMusic';
let HOST = 'https://api.audius.co';
const audio = document.getElementById('audio');
const $ = id => document.getElementById(id);

/* Playlists curadas — por gênero/estilo (conteúdo real e legal no Audius) */
const CURATED = [
  {id:'academia', title:'Academia',        sub:'Eletrônica pra treinar',       emoji:'🔥', grad:'linear-gradient(135deg,#e50914,#ff7a00)', type:'genre',  value:'Electronic'},
  {id:'house',    title:'House & EDM',      sub:'Batida pra dançar',            emoji:'🎧', grad:'linear-gradient(135deg,#7b2ff7,#f107a3)', type:'search', value:'house'},
  {id:'metal',    title:'Metal & Pesado',   sub:'Vibe SOAD · Linkin · Matanza', emoji:'🤘', grad:'linear-gradient(135deg,#3a3a3a,#e50914)', type:'genre',  value:'Metal'},
  {id:'rock',     title:'Rock',             sub:'Guitarra na veia',             emoji:'🎸', grad:'linear-gradient(135deg,#41295a,#2f0743)', type:'genre',  value:'Rock'},
  {id:'alt',      title:'Alternativo',      sub:'Indie & alt rock',             emoji:'🌘', grad:'linear-gradient(135deg,#0f2027,#2c5364)', type:'genre',  value:'Alternative'},
  {id:'pop',      title:'Pop',              sub:'Hits e vibes',                 emoji:'✨', grad:'linear-gradient(135deg,#ff512f,#dd2476)', type:'genre',  value:'Pop'},
  {id:'hiphop',   title:'Hip-Hop',          sub:'Rap & beats',                  emoji:'🎤', grad:'linear-gradient(135deg,#141e30,#243b55)', type:'genre',  value:'Hip-Hop/Rap'},
  {id:'latin',    title:'Latin',            sub:'Salsa, reggaeton & cia',       emoji:'💃', grad:'linear-gradient(135deg,#f7971e,#ffd200)', type:'genre',  value:'Latin'},
  {id:'funkbr',   title:'Funk Brasil',      sub:'Batidão nacional',             emoji:'🇧🇷', grad:'linear-gradient(135deg,#009e3c,#ffcb05)', type:'search', value:'funk brasil'},
  {id:'samba',    title:'Samba & Pagode',   sub:'Raiz brasileira',              emoji:'🥁', grad:'linear-gradient(135deg,#00b09b,#96c93d)', type:'search', value:'samba'},
  {id:'sertanejo',title:'Sertanejo',        sub:'Modão e mais',                 emoji:'🤠', grad:'linear-gradient(135deg,#8e2de2,#4a00e0)', type:'search', value:'sertanejo'},
];

const state = {
  view:'home',
  home:[], results:[],
  favorites: load('gi_favorites', []),
  userPlaylists: load('gi_playlists', []),   // [{id,name,tracks:[]}]
  cache:{},                                  // cache de playlists curadas
  currentList:[],                            // lista renderizada agora (pra tocar/adicionar)
  queue:[], index:-1,
  sheetTrack:null, currentUserPl:null,
};

function load(k,def){ try{const v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch(e){return def;} }
function save(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} }

/* ---------- Audius ---------- */
async function discoverHost(){
  try{ const r=await fetch('https://api.audius.co'); const j=await r.json();
    if(j.data&&j.data.length){ HOST=j.data[Math.floor(Math.random()*j.data.length)]; } }catch(e){}
}
const streamUrl = id => `${HOST}/v1/tracks/${id}/stream?app_name=${APP}`;
function artwork(t){ const a=t.artwork||{}; return a['480x480']||a['150x150']||a['1000x1000']||''; }
function fmt(s){ s=Math.max(0,Math.floor(s||0)); const m=Math.floor(s/60),x=s%60; return m+':'+String(x).padStart(2,'0'); }
function isFav(id){ return state.favorites.some(t=>t.id===id); }
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
async function api(path){
  const r=await fetch(`${HOST}${path}${path.includes('?')?'&':'?'}app_name=${APP}`);
  if(!r.ok) throw new Error(r.status);
  return (await r.json()).data||[];
}

/* ---------- render base ---------- */
const content=$('content');
function skeleton(n=8){
  let h='';
  for(let i=0;i<n;i++) h+=`<div class="skeleton"><div class="sk" style="width:50px;height:50px"></div>
    <div style="flex:1"><div class="sk" style="width:60%;height:13px;margin-bottom:8px"></div>
    <div class="sk" style="width:35%;height:11px"></div></div></div>`;
  content.innerHTML=`<div class="list">${h}</div>`;
}
function trackRow(t,i,opts={}){
  const active = state.queue[state.index] && state.queue[state.index].id===t.id;
  const fav=isFav(t.id);
  return `<div class="row ${active?'active':''}" data-i="${i}">
    ${opts.num?`<span class="num">${i+1}</span>`:''}
    <img class="art" loading="lazy" src="${artwork(t)}" alt="" onerror="this.style.opacity=.2">
    <div class="rinfo">
      <div class="rtitle">${esc(t.title)}</div>
      <div class="rartist">${esc(t.user?.name||'')}</div>
    </div>
    <span class="rdur">${fmt(t.duration)}</span>
    <button class="iconbtn more" data-more="${i}" title="Opções">
      <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>
    </button>
    <button class="iconbtn heart ${fav?'on':''}" data-fav="${i}" title="Favoritar">
      <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.9-10-9.6C.4 8.2 1.9 4.5 5.2 4.1 7 3.9 8.7 4.8 12 8c3.3-3.2 5-4.1 6.8-3.9 3.3.4 4.8 4.1 3.2 7.3C19.5 16.1 12 21 12 21z"/></svg>
    </button>

/* renderiza uma lista de faixas e a define como currentList */
function renderTracks(tracks,title,opts={}){
  state.currentList=tracks;
  if(!tracks.length){ content.innerHTML=(opts.headHtml||'')+emptyView(opts.emptyKind); return; }
  content.innerHTML=`${opts.headHtml||''}
    ${title?`<div class="section-title"><span class="dot"></span>${title}${opts.mini?`<span class="mini">${opts.mini}</span>`:''}</div>`:''}
    <div class="list">${tracks.map((t,i)=>trackRow(t,i,opts)).join('')}</div>`;
}
function emptyView(kind){
  if(kind==='fav') return `<div class="empty">
    <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.9-10-9.6C.4 8.2 1.9 4.5 5.2 4.1 7 3.9 8.7 4.8 12 8c3.3-3.2 5-4.1 6.8-3.9 3.3.4 4.8 4.1 3.2 7.3C19.5 16.1 12 21 12 21z"/></svg>
    <p>Nenhum favorito ainda.<br>Toque no ♥ nas músicas pra salvar aqui.</p></div>`;
  if(kind==='search') return `<div class="empty">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.49 4.49 0 0 1 9.5 14z"/></svg>
    <p>Busque por uma música ou artista lá em cima.</p></div>`;
  if(kind==='userpl') return `<div class="empty"><p>Playlist vazia.<br>Use o <b>+</b> nas músicas pra adicionar aqui.</p></div>`;
  return `<div class="empty"><p>Nada por aqui.</p></div>`;

/* ---------- views principais ---------- */
async function showHome(){
  state.view='home'; state.currentUserPl=null;
  if(state.home.length){ renderTracks(state.home,'Em alta agora'); return; }
  skeleton();
  try{ state.home=await api('/v1/tracks/trending?limit=40'); renderTracks(state.home,'Em alta agora'); }
  catch(e){ content.innerHTML=`<div class="empty"><p>Erro ao carregar. Verifique a conexão.</p></div>`; }
}

let searchTimer=null,lastQuery='';
async function doSearch(q){
  q=q.trim(); state.view='search'; state.currentUserPl=null;
  if(!q){ renderTracks([],'',{emptyKind:'search'}); return; }
  skeleton(6); lastQuery=q;
  try{
    const data=await api(`/v1/tracks/search?query=${encodeURIComponent(q)}&limit=40`);
    if(lastQuery!==q) return;
    state.results=data; renderTracks(data,`Resultados para "${esc(q)}"`);
  }catch(e){ content.innerHTML=`<div class="empty"><p>Erro na busca.</p></div>`; }
}

function showFav(){ state.view='fav'; state.currentUserPl=null; renderTracks(state.favorites,'Seus favoritos',{emptyKind:'fav'}); }

/* abrir playlist curada */
async function openCurated(id){
  const p=CURATED.find(x=>x.id===id); if(!p) return; state.currentUserPl=null;
  const head=headHtml(p.title, p.sub);
  if(state.cache[id]){ renderTracks(state.cache[id], p.title, {headHtml:head, mini:`${state.cache[id].length} faixas`, playall:true, curatedId:id}); wireHead(); return; }
  content.innerHTML=head+`<div class="skeleton" style="padding:40px;justify-content:center"><div class="sk" style="width:34px;height:34px;border-radius:50%"></div></div>`;
  wireHead();
  try{
    const path = p.type==='genre'
      ? `/v1/tracks/trending?genre=${encodeURIComponent(p.value)}&limit=40`
      : `/v1/tracks/search?query=${encodeURIComponent(p.value)}&limit=40`;
    const data=await api(path);
    state.cache[id]=data;
    renderTracks(data,p.title,{headHtml:head,mini:`${data.length} faixas`,playall:true,curatedId:id});
    wireHead();
  }catch(e){ content.innerHTML=head+`<div class="empty"><p>Erro ao carregar a playlist.</p></div>`; wireHead(); }
}

/* abrir playlist do usuário */
function openUserPlaylist(id){
  const p=state.userPlaylists.find(x=>x.id===id); if(!p) return;
  state.currentUserPl=id;
  const head=headHtml(p.name, `${p.tracks.length} faixa${p.tracks.length===1?'':'s'}`, {trash:true, userId:id, count:p.tracks.length});

function wireHead(userId){

/* ---------- player ---------- */
function playTracks(list,i){
  if(!list.length) return;
  state.queue=list.slice(); state.index=i; loadCurrent(true);
}
function loadCurrent(autoplay){
  const t=state.queue[state.index]; if(!t) return;
  audio.src=streamUrl(t.id);              // streaming progressivo (Range): toca sem esperar baixar tudo
  $('part').src=artwork(t);
  $('ptitle').textContent=t.title;
  $('partist').textContent=t.user?.name||'';
  $('player').classList.add('show');
  document.documentElement.style.setProperty('--player-h', getComputedStyle($('player')).height);
  updatePlayerFav(); updateNavButtons(); refreshActiveRow();
  if(autoplay) audio.play().catch(()=>{});
  if('mediaSession' in navigator){
    navigator.mediaSession.metadata=new MediaMetadata({
      title:t.title, artist:t.user?.name||'', album:'GiMusic',
      artwork:[{src:artwork(t),sizes:'480x480',type:'image/jpeg'}]});
  }
}
function togglePlay(){
  if(state.index<0){ if(state.currentList.length) playTracks(state.currentList,0); return; }
  if(audio.paused) audio.play().catch(()=>{}); else audio.pause();
}
function next(){ if(state.index<state.queue.length-1){ state.index++; loadCurrent(true);} }
function prev(){ if(audio.currentTime>3){ audio.currentTime=0; return; } if(state.index>0){ state.index--; loadCurrent(true);} else audio.currentTime=0; }
function updateNavButtons(){ $('next').disabled=state.index>=state.queue.length-1; }

audio.addEventListener('play', ()=>{ $('playIcon').innerHTML='<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>'; if('mediaSession'in navigator)navigator.mediaSession.playbackState='playing'; });
audio.addEventListener('pause',()=>{ $('playIcon').innerHTML='<path d="M8 5v14l11-7z"/>'; if('mediaSession'in navigator)navigator.mediaSession.playbackState='paused'; });
audio.addEventListener('ended', next);
audio.addEventListener('error', ()=>{ toast('Faixa indisponível — pulando'); setTimeout(next,600); });
audio.addEventListener('loadedmetadata', ()=>{ $('dur').textContent=fmt(audio.duration); });
audio.addEventListener('timeupdate', ()=>{ const d=audio.duration||0,c=audio.currentTime,p=d?c/d*100:0;
  $('fill').style.width=p+'%'; $('knob').style.left=p+'%'; $('cur').textContent=fmt(c); });
audio.addEventListener('progress', ()=>{ try{ if(audio.buffered.length){ const b=audio.buffered.end(audio.buffered.length-1),d=audio.duration||0;
  $('buf').style.width=(d?b/d*100:0)+'%'; } }catch(e){} });

const bar=$('bar');
function seekAt(x){ const r=bar.getBoundingClientRect(),p=Math.min(1,Math.max(0,(x-r.left)/r.width)); if(audio.duration) audio.currentTime=p*audio.duration; }
bar.addEventListener('click',e=>seekAt(e.clientX));
let dragging=false;
bar.addEventListener('pointerdown',e=>{dragging=true;seekAt(e.clientX);});
window.addEventListener('pointermove',e=>{if(dragging)seekAt(e.clientX);});
window.addEventListener('pointerup',()=>dragging=false);
if('mediaSession' in navigator){
  navigator.mediaSession.setActionHandler('play',()=>audio.play());
  navigator.mediaSession.setActionHandler('pause',()=>audio.pause());
  navigator.mediaSession.setActionHandler('previoustrack',prev);
  navigator.mediaSession.setActionHandler('nexttrack',next);
}

/* ---------- favoritos ---------- */
function toggleFav(track){
  if(isFav(track.id)){ state.favorites=state.favorites.filter(x=>x.id!==track.id); toast('Removido dos favoritos'); }
  else { state.favorites.unshift(track); toast('❤ Adicionado aos favoritos'); }
  save('gi_favorites',state.favorites);
  document.querySelectorAll('.row').forEach((r,i)=>{ const t=state.currentList[+r.dataset.i]; if(t){ r.querySelector('.heart')?.classList.toggle('on',isFav(t.id)); } });
  updatePlayerFav();
  if(state.view==='fav') showFav();
}
function updatePlayerFav(){ const t=state.queue[state.index]; $('pfav').classList.toggle('on', t?isFav(t.id):false); }
function refreshActiveRow(){ document.querySelectorAll('.row').forEach(r=>{ const t=state.currentList[+r.dataset.i];
  r.classList.toggle('active', !!(t && state.queue[state.index] && t.id===state.queue[state.index].id)); }); }

/* ---------- playlists do usuário: adicionar ---------- */
function canDownload(t){ const d=t.download||{}; return !!(t.is_downloadable||d.is_downloadable) && !d.requires_follow; }
function downloadTrack(t){

function closeSheet(){ $('overlay').classList.remove('show'); $('sheet').classList.remove('show'); state.sheetTrack=null; }
function addToPlaylist(id,track){
  const p=state.userPlaylists.find(x=>x.id===id); if(!p) return;
  if(p.tracks.some(t=>t.id===track.id)){ toast('Já está nessa playlist'); return; }
  p.tracks.push(track); save('gi_playlists',state.userPlaylists); toast(`Adicionada a "${p.name}"`);
}
function removeFromPlaylist(plId,trackId){
  const p=state.userPlaylists.find(x=>x.id===plId); if(!p) return;
  p.tracks=p.tracks.filter(t=>t.id!==trackId); save('gi_playlists',state.userPlaylists);
  toast('Removida da playlist'); openUserPlaylist(plId);
}
function createPlaylist(name,firstTrack){
  name=(name||'').trim(); if(!name) return null;
  const p={id:Date.now(), name, tracks:firstTrack?[firstTrack]:[]};
  state.userPlaylists.unshift(p); save('gi_playlists',state.userPlaylists); return p;
}

$('overlay').addEventListener('click',closeSheet);
$('sheet').addEventListener('click',e=>{
  const t=state.sheetTrack; if(!t) return;
  if(e.target.closest('[data-favtoggle]')){ toggleFav(t); closeSheet(); return; }

    const name=prompt('Nome da nova playlist:'); closeSheet();
    const p=createPlaylist(name,t); if(p){ toast(`Playlist "${p.name}" criada`); if(state.view==='playlists') showPlaylists(); }
  }
});

/* ---------- painel de letra ---------- */
const lyr={open:false,lastIdx:-1,data:null,showTrans:true,cache:{}};

function cleanTitle(s){
  return (s||'')
    .replace(/\s*[\(\[][^)\]]*[\)\]]/g,'')                       // remove (feat...), [remix]...
    .replace(/\s*-\s*.*(remix|edit|cover|bootleg|vip|live|version|remaster|prod).*/i,'')
    .trim();
}
async function lrclibGet(track){
  const artist=track.user?.name||'', dur=Math.round(track.duration||0), base='https://lrclib.net/api';
  try{
    const u=`${base}/get?artist_name=${encodeURIComponent(artist)}&track_name=${encodeURIComponent(track.title)}&duration=${dur}`;
    const r=await fetch(u); if(r.ok){ const j=await r.json(); if(j&&(j.syncedLyrics||j.plainLyrics)) return j; }
  }catch(e){}
  const ct=cleanTitle(track.title);
  const tries=[
    `${base}/search?track_name=${encodeURIComponent(ct)}&artist_name=${encodeURIComponent(artist)}`,
    `${base}/search?q=${encodeURIComponent(ct+' '+artist)}`,
    `${base}/search?track_name=${encodeURIComponent(ct)}`,
  ];
  for(const u of tries){
    try{ const r=await fetch(u); if(r.ok){ const arr=await r.json(); const hit=(arr||[]).find(x=>x.syncedLyrics||x.plainLyrics); if(hit) return hit; } }catch(e){}
  }
  return null;
}
function parseLRC(lrc){
  const out=[];
  lrc.split('\n').forEach(line=>{
    const stamps=[...line.matchAll(/\[(\d+):(\d+)(?:[.:](\d+))?\]/g)];
    const text=line.replace(/\[[^\]]*\]/g,'').trim();
    stamps.forEach(g=>{ const t=(+g[1])*60+(+g[2])+(g[3]?parseFloat('0.'+g[3]):0); out.push({t,text}); });
  });
  return out.sort((a,b)=>a.t-b.t).filter(l=>l.text!=='');
}
async function gtx(text){
  const u=`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=pt&dt=t&q=${encodeURIComponent(text)}`;
  const r=await fetch(u); const j=await r.json();
  return {lang:j[2]||'', text:(j[0]||[]).map(s=>s[0]).join('')};
}
async function translateLines(lines){
  const chunks=[]; let cur=[],len=0;
  for(const t of lines){ if(len+t.length+1>1300 && cur.length){ chunks.push(cur); cur=[]; len=0; } cur.push(t); len+=t.length+1; }
  if(cur.length) chunks.push(cur);
  let lang='', translated=[];
  for(const ch of chunks){
    try{
      const res=await gtx(ch.join('\n'));
      if(!lang) lang=res.lang;
      let tl=res.text.split('\n');
      while(tl.length<ch.length) tl.push('');
      if(tl.length>ch.length) tl=tl.slice(0,ch.length);
      translated=translated.concat(tl);
    }catch(e){ translated=translated.concat(ch.map(()=>'')); }
  }
  return {lang, translated};
}
async function getLyrics(track){
  if(lyr.cache[track.id]) return lyr.cache[track.id];
  const raw=await lrclibGet(track);
  let res;
  const synced = raw && !!raw.syncedLyrics;
  const lines = raw ? (synced ? parseLRC(raw.syncedLyrics)
              : (raw.plainLyrics||'').split('\n').map(text=>({t:null,text})).filter(l=>l.text.trim()!=='')) : [];
  if(!lines.length){ res={found:false}; }
  else{
    let translated=[], lang='', international=false;
    try{ const tr=await translateLines(lines.map(l=>l.text)); lang=tr.lang; translated=tr.translated; international=!!(lang && lang!=='pt'); }catch(e){}
    res={found:true, synced, lines, translated, international, lang};
  }
  lyr.cache[track.id]=res; return res;
}
function lineEls(arr){ return arr.map((txt,i)=>`<div class="line" data-i="${i}">${esc(txt)||'&nbsp;'}</div>`).join(''); }
function renderLyrics(data){
  const tbtn=$('transToggle');
  if(!data.found){
    $('lyricsBody').innerHTML=`<div class="lyrics-empty">
      <svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
      <p>Letra não encontrada pra esta faixa.<br><small>Boa parte da música independente do Audius ainda não tem letra catalogada.</small></p></div>`;
    tbtn.style.display='none'; return;
  }
  lyr.data=data; lyr.lastIdx=-1;
  const plainCls=data.synced?'':'plain';
  const orig=`<div class="pane orig ${plainCls}"><div class="plabel">Original${data.lang?' · '+data.lang.toUpperCase():''}</div>${lineEls(data.lines.map(l=>l.text))}</div>`;
  if(data.international && lyr.showTrans){
    const trans=`<div class="pane trans ${plainCls}"><div class="plabel">Português</div>${lineEls(data.translated)}</div>`;
    $('lyricsBody').innerHTML=orig+trans;
  } else {
    $('lyricsBody').innerHTML=orig;
  }
  tbtn.style.display = data.international ? 'grid' : 'none';
  tbtn.classList.toggle('on', lyr.showTrans);
  updateLyricHighlight(true);
}
function updateLyricHighlight(force){
  if(!lyr.open || !lyr.data || !lyr.data.synced) return;
  const lines=lyr.data.lines, ct=audio.currentTime; let idx=-1;
  for(let i=0;i<lines.length;i++){ if(lines[i].t<=ct) idx=i; else break; }
  if(idx===lyr.lastIdx && !force) return;
  lyr.lastIdx=idx;
  document.querySelectorAll('#lyricsBody .pane').forEach(pane=>{
    pane.querySelectorAll('.line.active').forEach(el=>el.classList.remove('active'));
    const el=pane.querySelector(`.line[data-i="${idx}"]`);
    if(el){ el.classList.add('active'); pane.scrollTop = el.offsetTop - pane.clientHeight/2 + el.clientHeight/2; }
  });
}
function artistBg(t){
  const u=t.user||{}, cp=u.cover_photo||{}, pp=u.profile_picture||{}, aw=t.artwork||{};
  return cp['2000x']||cp['640x']||pp['1000x1000']||pp['480x480']||aw['1000x1000']||aw['480x480']||'';
}
async function openLyrics(reload){
  const t=state.queue[state.index];
  if(!t){ toast('Nada tocando'); return; }
  lyr.open=true; $('lyrics').classList.add('show');
  $('lyricsTitle').textContent=t.title; $('lyricsArtist').textContent=t.user?.name||'';
  const bg=artistBg(t), bgEl=$('lyricsBg');
  if(bg){ bgEl.style.backgroundImage=`url("${bg}")`; bgEl.classList.add('show'); }
  else { bgEl.classList.remove('show'); bgEl.style.backgroundImage=''; }
  if(!reload) $('lyricsBody').innerHTML=`<div class="spin" style="margin:auto"></div>`;
  const data=await getLyrics(t);
  if(state.queue[state.index] && state.queue[state.index].id===t.id) renderLyrics(data);
}
function closeLyrics(){ lyr.open=false; $('lyrics').classList.remove('show'); }

$('lyricsClose').addEventListener('click',closeLyrics);
$('transToggle').addEventListener('click',()=>{ lyr.showTrans=!lyr.showTrans; if(lyr.data) renderLyrics(lyr.data); });
$('pmeta').addEventListener('click',()=>openLyrics(false));
audio.addEventListener('timeupdate',()=>updateLyricHighlight(false));
audio.addEventListener('loadstart',()=>{ lyr.lastIdx=-1; if(lyr.open) openLyrics(true); });

/* ---------- init ---------- */
(async function init(){ await discoverHost(); showHome(); })();
</script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
